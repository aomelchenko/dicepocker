<!doctype html>
<meta charset="utf-8">
<title>DicePocker background</title>
<script type="module">
// Runs for everyone in the room. Draws each player's latest roll on the map as local-only items
// (nothing is saved into the scene, and no permissions are needed).
import OBR, { buildShape, buildText } from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm";
import { decode, layout, rerollsLeft, withMoved, inside, prunePositions } from "./logic.js";

const PREFIX = "com.dicepocker/p/";
const POS_KEY = "com.dicepocker/pos"; // GM-moved positions
const TOOL = "com.dicepocker/tool", MODE = "com.dicepocker/move";
const ICON = new URL("move-dice.svg", import.meta.url).href;
const LOOK = {
  stale:  { fill: "#8a93a6", stroke: "#2b2f3a", ink: "#ffffff", sw: 3 },
  frozen: { fill: "#e6e1d3", stroke: "#6b6b6b", ink: "#2a2a2a", sw: 3 },
  active: { fill: "#ffffff", stroke: null,      ink: "#000000", sw: 6 }, // stroke = player colour
};
const drawn = new Map(); // player key -> { sig, ids }
let chain = Promise.resolve();
const queue = (fn) => (chain = chain.then(fn).catch((e) => console.error("DicePocker:", e)));

const common = (item, x, y) => {
  item.position = { x, y };
  item.layer = "ATTACHMENT";
  item.locked = true;
  item.disableHit = true; // clicks pass through to the map
  return item;
};
function box(x, y, s, look, stroke) {
  const b = common(buildShape().width(s).height(s).shapeType("RECTANGLE").build(), x, y);
  b.style = { fillColor: look.fill, fillOpacity: 1, strokeColor: stroke, strokeOpacity: 1, strokeWidth: look.sw, strokeDash: [] };
  return b;
}
function text(str, x, y, w, h, style) {
  const t = common(buildText().richText([{ type: "paragraph", children: [{ text: str }] }]).build(), x, y);
  t.text = {
    ...t.text, type: "PLAIN", plainText: str, width: w, height: h,
    style: {
      fillColor: "#000", fillOpacity: 1, strokeColor: "#000", strokeOpacity: 1, strokeWidth: 0,
      textAlign: "CENTER", textAlignVertical: "MIDDLE", fontFamily: "Roboto",
      fontSize: 16, fontWeight: 400, lineHeight: 1, padding: 0, ...style,
    },
  };
  return t;
}
function build(e, data, size) {
  const L = layout(e, size);
  const x0 = e.x - L.width / 2, y0 = e.y - L.height / 2;
  const colour = data.c || "#e5484d";
  const items = [];
  const left = rerollsLeft(e);
  items.push(text(`${data.n || "Player"}  ·  re-rolls left: ${left}`, x0, y0 - size * 0.6, Math.max(L.width, size * 6), size * 0.5, {
    textAlign: "LEFT", fillColor: colour, strokeColor: "#000", strokeWidth: 3, fontSize: size * 0.3, fontWeight: 700,
  }));
  for (const c of L.cells) {
    const look = LOOK[c.kind];
    items.push(box(x0 + c.x, y0 + c.y, size, look, look.stroke || colour));
    items.push(text(String(c.v), x0 + c.x, y0 + c.y, size, size, { fillColor: look.ink, fontSize: size * 0.62, fontWeight: 700 }));
  }
  // Explicit stacking: each box, then its digit, then the next box. Without this, items created in the
  // same millisecond tie on z-index and a digit can end up underneath its own box.
  const z = Date.now();
  items.forEach((it, i) => { it.zIndex = z + i; it.disableAutoZIndex = true; });
  // grab area for the Move tool: the dice plus the name label above them
  return { items, bounds: { x: x0, y: y0 - size * 0.6, w: Math.max(L.width, size * 6), h: L.height + size * 0.6 } };
}
async function drop(key) {
  const d = drawn.get(key);
  drawn.delete(key);
  if (d?.ids.length) await OBR.scene.local.deleteItems(d.ids);
}
async function sync() {
  if (!(await OBR.scene.isReady())) { drawn.clear(); return; }
  const meta = await OBR.room.getMetadata();
  const size = Math.round(Math.max(48, (await OBR.scene.grid.getDpi()) * 0.75));
  const live = new Set();
  const moved = meta[POS_KEY] || {};
  for (const [key, data] of Object.entries(meta)) {
    if (!key.startsWith(PREFIX) || !data?.l?.length) continue;
    live.add(key);
    if (drag?.key === key) continue; // being dragged right now; redrawn when the drop is saved
    const e = data.s ? withMoved(decode(data.l[0]), moved[key]) : null;
    const sig = [data.s, data.n, data.c, size, data.l[0], e?.x, e?.y].join("|");
    if (drawn.get(key)?.sig === sig) continue;
    await drop(key);
    if (!e) continue;
    const { items, bounds } = build(e, data, size);
    await OBR.scene.local.addItems(items);
    drawn.set(key, { sig, ids: items.map((i) => i.id), bounds, t: e.t, center: { x: e.x, y: e.y } });
  }
  for (const key of [...drawn.keys()]) if (!live.has(key)) await drop(key);
}

// ---------- GM "Move dice" tool: drag a dice group to a new spot, for everyone ----------
let drag = null; // { key, d, start, base, fast, busy, dx, dy }
const grabbed = (p) => { let hit = null; for (const [key, d] of drawn) if (inside(p, d.bounds)) hit = key; return hit; };
async function moveTo(g, dx, dy) {
  const apply = (items) => { for (const it of items) { const b = g.base.get(it.id); if (b) { it.position.x = b.x + dx; it.position.y = b.y + dy; } } };
  try { await OBR.scene.local.updateItems(g.d.ids, apply, g.fast); }
  catch (err) { if (!g.fast) throw err; g.fast = false; await OBR.scene.local.updateItems(g.d.ids, apply, false); }
}
async function pump(g) { // live preview on the GM's screen, one update at a time
  g.busy = true;
  try {
    let sx, sy;
    do { sx = g.dx; sy = g.dy; await moveTo(g, sx, sy); } while (sx !== g.dx || sy !== g.dy);
  } catch (err) { console.error("DicePocker:", err); } finally { g.busy = false; }
}
async function dragStart(event) {
  const key = grabbed(event.pointerPosition);
  if (!key) return;
  const d = drawn.get(key);
  const items = await OBR.scene.local.getItems(d.ids);
  drag = { key, d, start: event.pointerPosition, base: new Map(items.map((i) => [i.id, { ...i.position }])), fast: true, busy: false, dx: 0, dy: 0 };
}
function dragMove(event) {
  const g = drag;
  if (!g) return;
  g.dx = event.pointerPosition.x - g.start.x;
  g.dy = event.pointerPosition.y - g.start.y;
  if (!g.busy) pump(g);
}
async function dragEnd(event) {
  const g = drag;
  if (!g) return;
  g.dx = event.pointerPosition.x - g.start.x;
  g.dy = event.pointerPosition.y - g.start.y;
  for (let i = 0; g.busy && i < 50; i++) await new Promise((r) => setTimeout(r, 10));
  try {
    if (Math.hypot(g.dx, g.dy) < 3) { await moveTo(g, 0, 0); return; } // a click, not a drag
    const meta = await OBR.room.getMetadata();
    const times = {};
    for (const [k, v] of Object.entries(meta)) if (k.startsWith(PREFIX) && v?.l?.[0]) times[k] = decode(v.l[0])?.t;
    const pos = prunePositions(meta[POS_KEY], times);
    pos[g.key] = [g.d.t, Math.round(g.d.center.x + g.dx), Math.round(g.d.center.y + g.dy)];
    await OBR.room.setMetadata({ [POS_KEY]: pos });
  } catch (err) {
    console.error("DicePocker:", err);
    try { await moveTo(g, 0, 0); OBR.notification.show("DicePocker: couldn't save the new dice position.", "ERROR"); } catch {}
  } finally { drag = null; run(); }
}
async function dragCancel() {
  const g = drag;
  drag = null;
  if (g) { try { await moveTo(g, 0, 0); } catch (err) { console.error("DicePocker:", err); } }
}
let toolOn = false, toolChain = Promise.resolve();
async function setTool(on) {
  if (on === toolOn) return;
  toolOn = on;
  if (on) {
    await OBR.tool.create({ id: TOOL, defaultMode: MODE, icons: [{ icon: ICON, label: "Move dice (DicePocker)" }] });
    await OBR.tool.createMode({
      id: MODE,
      icons: [{ icon: ICON, label: "Drag a dice group to move it", filter: { activeTools: [TOOL] } }],
      onToolDragStart: (_, e) => dragStart(e),
      onToolDragMove: (_, e) => dragMove(e),
      onToolDragEnd: (_, e) => dragEnd(e),
      onToolDragCancel: () => dragCancel(),
    });
  } else {
    await OBR.tool.removeMode(MODE);
    await OBR.tool.remove(TOOL);
  }
}
const run = () => queue(sync);

OBR.onReady(async () => {
  OBR.room.onMetadataChange(run);
  OBR.scene.grid.onChange(run);
  OBR.scene.onReadyChange((ready) => { drawn.clear(); if (ready) run(); }); // local items vanish with the scene
  run();
  const setGM = (role) => (toolChain = toolChain.then(() => setTool(role === "GM")).catch((e) => console.error("DicePocker:", e)));
  setGM(await OBR.player.getRole());
  OBR.player.onChange((p) => setGM(p.role));
});
</script>
